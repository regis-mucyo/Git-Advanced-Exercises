<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 text-gray-800 leading-relaxed">
    <header
      class="max-w-4xl mx-auto my-5 p-6 bg-gray-900 text-white rounded-lg shadow-md border-b-4 border-blue-500"
    >
      <h1 class="text-3xl font-bold m-0 p-0">My Awesome Portfolio</h1>
    </header>

    <main class="max-w-4xl mx-auto my-5 p-6 bg-white rounded-lg shadow-md">
      <section id="about" class="mb-6">
        <h2
          class="text-2xl font-bold text-blue-600 border-b-2 border-gray-100 pb-2 mb-4"
        >
          About Me
        </h2>
        <p>
          Welcome to my portfolio. I am a developer passionate about building
          cool things for the web.
        </p>
      </section>

      <section id="projects">
        <h2
          class="text-2xl font-bold text-blue-600 border-b-2 border-gray-100 pb-2 mb-4"
        >
          My Projects
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-gray-50 p-4 rounded-lg shadow-inner">
            <h3 class="text-xl font-semibold text-blue-700">Project Alpha</h3>
            <p class="text-gray-600 mt-2">Description for the first project.</p>
          </div>
        </div>
        <div class="bg-gray-50 p-4 rounded-lg shadow-inner">
          <h3 class="text-xl font-semibold text-blue-700">Project Beta</h3>
          <p class="text-gray-600 mt-2">Description for the second project.</p>
        </div>
      </section>
    </main>

    <footer
      class="max-w-4xl mx-auto my-5 p-6 text-center text-sm text-gray-500"
    >
      <p>&copy; 2025 My Portfolio</p>
    </footer>
  </body>
</html>
